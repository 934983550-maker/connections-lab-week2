<!DOCTYPE html>
<html>
<head>
    <title>3:00 AM</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="room">

        <p id="time">3:00 AM</p>

        <h1 id="story">
            I heard someone knocking at my door.
        </h1>

        <div id="door">
            <div class="knob"></div>
            <div class="peephole"></div>
        </div>

        <button id="checkDoor">
            CHECK THE DOOR
        </button>

        <button id="checkPeephole" class="hidden">
            CHECK PEEPHOLE
        </button>

    </div>


    <div id="peepholeView" class="hidden">
        <div class="viewCircle"></div>
        <h2>I LIVE ALONE.</h2>
    </div>


    <script src="script.js"></script>

</body>
</html>
